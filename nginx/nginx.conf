server {
    listen 80;
    server_name _;

    # Serve the React SPA
    root /usr/share/nginx/html;
    index index.html;

    # Increase timeouts for LLM-backed endpoints
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;

    # Frontend — SPA fallback so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — proxy to FastAPI (preserves /api/ prefix, which the router expects)
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://api:8000/health;
    }

    # Let's Encrypt ACME challenge (used when adding HTTPS later)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
